- clone_settings:
  - range_id: 44
    hosts:
    - host_id: host_1
      instance_number: 1
      guests:
      - guest_id: host-1-0
        entry_point: true
        number: 1
      - guest_id: host-2-0
        number: 1
      - guest_id: host-3-0
        number: 1
      topology:
      - type: custom
        networks:
        - name: link01
          members: host-1-0.eth0
        - name: link12
          members: host-1-0.eth1, host-2-0.eth0
        - name: link13
          members: host-1-0.eth2, host-3-0.eth0
        - name: link23
          members: host-2-0.eth1, host-3-0.eth1
