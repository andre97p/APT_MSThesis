    tasks:
    - add_account:
      - account: test
        passwd: test1234
    - copy_content:
      - src: /home/andrea/PenGym/database
        dst: /bin/cyberrange
      - src: /home/andrea/PenGym/cyber_range
        dst: /bin/cyberrange
    - execute_program:
